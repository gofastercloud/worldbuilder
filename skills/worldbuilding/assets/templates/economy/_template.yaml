# ─── SHOCKS (structured effects of events) ───────────────────────────────────
# The event file keeps `economic_impact` as a prose string. Put the structured
# effects here, one entry per event slug.
shocks:
  # - event: "the-grain-blight"
  #   production_effects: [{ location: "valdris", resource: "grain", change: halved, duration: "2 years" }]
