[project]
name = "worldbuilder"
version = "0.1.0"
description = "Structured worldbuilding and book-writing system — CLI, MCP server, and web UI"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
voicegen = [
    "mlx-audio>=0.4.1",
    "numpy>=2.2.6",
    "soundfile>=0.13.1",
]
imagegen = [
    "mflux>=0.16",
]
all-media = [
    "worldbuilder[voicegen,imagegen]",
]
mcp = [
    "mcp[cli]>=1.0",
]
dev = [
    "ruff==0.15.7",
    "pytest==9.0.2",
    "pyright==1.1.407",
]

[project.scripts]
worldbuilder = "scripts.worldbuilder:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "webapp", "mcp_server"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pyright]
include = ["scripts", "mcp_server", "webapp", "tests"]
extraPaths = ["scripts", "webapp", "mcp_server"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
