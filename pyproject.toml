[project]
name = "worldbuilder"
version = "0.1.0"
description = "Multi-agent plugin (Antigravity, Claude, Codex) for building internally consistent fictional worlds"
requires-python = ">=3.9"
# No runtime dependencies: the plugin's scripts use the standard library and a vendored copy of PyYAML.
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["skills/world-validate/scripts/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
